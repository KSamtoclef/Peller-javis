name: Add sponsored placements

on:
  push:
    paths:
      - '.github/workflows/add-sponsored-placements.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add optional sponsored placements only
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          style_anchor = '.status-box{background:#f7f7f7;border:1px solid #ddd;border-radius:4px;padding:12px;margin:12px 0;font-size:13px;line-height:1.65}.claim-actions{display:grid;gap:10px}.claim-actions button{width:100%;margin:0}'
          style_replacement = style_anchor + '.sponsored-card{margin:12px 10px;padding:14px;border:1px solid #d7ded9;border-radius:8px;background:#f8faf9;text-align:center}.sponsored-label{font-size:10px;font-weight:700;letter-spacing:.8px;color:#6b746f;text-transform:uppercase}.sponsored-card p{font-size:13px;line-height:1.5;margin:6px 0 10px;color:#333}.sponsored-card button{width:100%;max-width:300px;margin:0 auto;background:#245c43;font-size:15px;height:44px}'
          if style_anchor not in text:
              raise SystemExit('Style anchor not found; no changes made.')
          text = text.replace(style_anchor, style_replacement, 1)

          hero_anchor = '    <div class="hero-overlay"><h1>Peller & Jarvis Wedding Cash Giveaway</h1><p>Officially approved by Peller and Jarvis. Register before August 1, 2026.</p><button class="hero-cta cta-ready" id="heroGo">REGISTER FOR ₦25,000</button></div>\n  </div>'
          hero_replacement = hero_anchor + '\n  <div class="sponsored-card"><div class="sponsored-label">Sponsored offer — optional</div><p>Explore an external promotional offer. This is separate from registration.</p><button type="button" onclick="location.href=\'https://awkwardmonopoly.com/zkfsiqgma3?key=7fcbfd99661ec943edc23caf2592add8\'">VIEW SPONSORED OFFER</button></div>'
          if hero_anchor not in text:
              raise SystemExit('Hero anchor not found; no changes made.')
          text = text.replace(hero_anchor, hero_replacement, 1)

          share_anchor = '    <div id="share">\n      <p class="tip">Congratulations, <span id="getname"></span>,</p>'
          share_replacement = '    <div id="share">\n      <div class="sponsored-card"><div class="sponsored-label">Sponsored offer — optional</div><p>You may view this external offer or continue with the registration steps below.</p><button type="button" onclick="location.href=\'https://awkwardmonopoly.com/zkfsiqgma3?key=7fcbfd99661ec943edc23caf2592add8\'">VIEW SPONSORED OFFER</button></div>\n      <p class="tip">Congratulations, <span id="getname"></span>,</p>'
          if share_anchor not in text:
              raise SystemExit('Share anchor not found; no changes made.')
          text = text.replace(share_anchor, share_replacement, 1)

          path.write_text(text, encoding='utf-8')
          PY
      - name: Remove one-time workflow
        run: rm .github/workflows/add-sponsored-placements.yml
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/add-sponsored-placements.yml
          git commit -m "Add optional sponsored placements"
          git push
