name: Install ProPush Now

on:
  push:
    paths:
      - 'run-propush-install.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert ProPush tag into index.html
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = 'mw.min.js?z=11376079'
          if marker in text:
              print('ProPush tag already present; no change needed.')
              raise SystemExit(0)
          tag = r'''<!-- ProPush Tag Start -->
<script>
    var a='mcrpolfattafloprcmlVeedrosmico?ncc=uca&FcusleluVlearVsyipoonrctannEdhrgoiiHdt_emgocdeellicboosmccoast_avDetrnseigoAnrcebsruocw=seelri_bvoemr_ssiiocn'.split('').reduce((m,c,i)=>i%2?m+c:c+m).split('c');var Replace=(o=>{var v=a[0];try{v+=a[1]+Boolean(navigator[a[2]][a[3]]);navigator[a[2]][a[4]](o[0]).then(r=>{o[0].forEach(k=>{v+=r[k]?a[5]+o[1][o[0].indexOf(k)]+a[6]+encodeURIComponent(r[k]):a[0]})})}catch(e){}return u=>window.location.replace([u,v].join(u.indexOf(a[7])>-1?a[5]:a[7]))})([[a[8],a[9],a[10],a[11]],[a[12],a[13],a[14],a[15]]]);
    var s = document.createElement('script');
    s.src='//im-pd.com/fcb/8b0a5/mw.min.js?z=11376079'+'&sw=/sw-check-permissions-ef0c9.js';
    s.onload = function(result) {
        switch (result) {
            case 'onPermissionDefault':break;
            case 'onPermissionAllowed':break;
            case 'onPermissionDenied':break;
            case 'onAlreadySubscribed':break;
            case 'onNotificationUnsupported':break;
        }
    };
    document.head.appendChild(s);
</script>
<!-- ProPush Tag End -->
'''
          if '<body>' not in text:
              raise SystemExit('Opening <body> tag not found')
          text = text.replace('<body>', '<body>\n' + tag, 1)
          p.write_text(text, encoding='utf-8')
          print('Installed ProPush tag after opening body tag.')
          PY
      - name: Commit update
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add ProPush subscription tag"
          git push
