name: Install ProPush loader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/install-propush-safe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert ProPush loader
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          marker = '<!-- ProPush Loader Start -->'
          if marker not in text:
              tag = '''  <!-- ProPush Loader Start -->
  <script>
    (function () {
      var s = document.createElement('script');
      s.src = 'https://im-pd.com/fcb/8b0a5/mw.min.js?z=11376079&sw=/sw-check-permissions-ef0c9.js';
      s.async = true;
      document.head.appendChild(s);
    })();
  </script>
  <!-- ProPush Loader End -->
'''
              text = text.replace('</head>', tag + '</head>', 1)
              p.write_text(text, encoding='utf-8')
      - name: Commit change
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add ProPush loader"
          git push
